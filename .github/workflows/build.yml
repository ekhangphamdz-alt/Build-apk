name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip source
        run: unzip -o MkhoaApp.zip -d extracted_src
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build project
        run: |
          GRADLEW_PATH=$(find extracted_src -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            echo "Found project at: $PROJECT_DIR"
            cd "$PROJECT_DIR" && chmod +x gradlew && ./gradlew assembleDebug
          else
            echo "Không tìm thấy gradlew trong MkhoaApp.zip. Nội dung bên trong:"
            find extracted_src -maxdepth 3
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: "**/outputs/apk/debug/*.apk"
          
          
